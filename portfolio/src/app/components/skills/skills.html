<section class="bg-gradient-to-br from-papaya-whip-900 to-white py-16" id="skills">
  <div class="max-w-5xl mx-auto px-6 md:px-8">
    <h2 class="text-primary text-center text-3xl md:text-4xl font-semibold mb-12 tracking-wide">
      Skills
    </h2>
    
    <div class="grid gap-6 md:grid-cols-2">
      <div *ngFor="let category of skillCategories" class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300 p-6">
        <h3 class="text-rich-black font-bold text-lg mb-4 pb-2 border-b-2 border-primary">{{ category.category }}</h3>
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let skill of category.skills" 
                class="bg-papaya-whip-700 text-primary font-medium px-3 py-1.5 rounded-full text-sm hover:bg-primary hover:text-white transition-colors duration-200">
            {{ skill }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
